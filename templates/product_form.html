{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('admin_products') }}">← Product management</a><p class="eyebrow">PRODUCT CATALOGUE</p><h1>{{ heading }}</h1><div class="form-card"><form method="post" action="{{ action }}" class="stack-form"><label>Product name<input name="name" value="{{ product.name or '' }}" required maxlength="120"></label><label>Category<input name="category" value="{{ product.category or '' }}" required maxlength="80" placeholder="Electronics, Home…"></label><label>Description<textarea name="description" rows="3" maxlength="1000">{{ product.description or '' }}</textarea></label><div class="two-col"><label>Price (Rs.)<input type="number" name="price" min="0" step="0.01" value="{{ product.price if product.price is defined else '' }}" required></label><label>Stock quantity<input type="number" name="stock" min="0" step="1" value="{{ product.stock if product.stock is defined else 0 }}" required></label></div><label>Image URL (optional)<input type="url" name="image_url" value="{{ product.image_url or '' }}" placeholder="https://…"></label><div class="form-actions"><button class="btn">Save product</button><a class="btn btn-light" href="{{ url_for('admin_products') }}">Cancel</a></div></form></div>{% endblock %}
