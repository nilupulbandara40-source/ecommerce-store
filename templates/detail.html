{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('index') }}">← Back to store</a><div class="detail-layout"><div class="detail-art">{% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}">{% else %}<span class="product-symbol">✧</span>{% endif %}</div><div><p class="eyebrow">{{ product.category }}</p><h1>{{ product.name }}</h1><p class="muted">{{ product.description }}</p><h2 class="price">Rs. {{ '%.2f'|format(product.price) }}</h2><p>{{ product.stock }} available</p><form class="inline-form" method="post" action="{{ url_for('add_to_cart',product_id=product.id) }}"><input type="number" name="quantity" min="1" max="{{ product.stock }}" value="1" required><button class="btn" {% if product.stock==0 %}disabled{% endif %}>Add to cart</button></form></div></div>{% endblock %}
